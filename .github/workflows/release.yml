name: Release

# Push a tag vX.Y.Z on development to publish a release. See CONTRIBUTING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches plugin.json
        run: |
          version="v$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v head="## $GITHUB_REF_NAME " 'index($0, head) == 1 {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Test
        run: make test
      - name: Bundle
        run: make bundle
      - name: Checksum
        working-directory: dist
        run: for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
