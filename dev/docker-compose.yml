# Local Mattermost for plugin development. Not for production use.
# Start:  docker compose -f dev/docker-compose.yml up -d
# Open:   http://localhost:8065
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_dev_only
      POSTGRES_DB: mattermost
    volumes:
      - pgdata:/var/lib/postgresql/data

  mattermost:
    image: mattermost/mattermost-team-edition:${MM_VERSION:-11.7.11}
    # Team Edition images are amd64 only; Docker Desktop emulates on Apple silicon.
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_dev_only@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
    volumes:
      - mmdata:/mattermost/data
      - mmplugins:/mattermost/plugins

volumes:
  pgdata:
  mmdata:
  mmplugins:
